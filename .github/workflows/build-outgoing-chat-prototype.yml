name: Build Unified Outgoing Chat Test

on:
  push:
    branches:
      - feature/outgoing-chat-prototype
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Generate assets
        run: python tools/build_assets.py

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build unified test application
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --uac-admin `
            --name CoD2ChatTranslator_UNIFIED_TEST `
            --icon assets/app.ico `
            --add-data "assets;assets" `
            app.py

      - name: Prepare test notes
        shell: pwsh
        run: |
          @"
          CoD2 Chat Translator — Unified Outgoing Chat Test

          TEST BUILD ONLY.

          This build contains both:
          - incoming chat translation / overlay
          - outgoing translated chat

          The application requests Administrator rights automatically.

          OUTGOING CHAT:
          1. Choose "My language" in the main application.
          2. Choose the language to send to CoD2.
          3. Start CoD2.
          4. Press F9 in game.
          5. Type the message.
          6. Enter = translate.
          7. Enter again = send to all-chat.
          8. Esc or F9 = cancel.

          F8 keeps its existing incoming-overlay show/hide function.

          No installer.
          No updater package.
          No GitHub Release.
          "@ | Set-Content -Encoding UTF8 dist\TEST_README.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CoD2-Chat-Translator-UNIFIED-TEST
          path: |
            dist/CoD2ChatTranslator_UNIFIED_TEST.exe
            dist/TEST_README.txt
