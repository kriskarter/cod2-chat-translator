name: Build CoD2 Chat Translator Release Candidate

on:
  push:
    branches:
      - feature/outgoing-chat-prototype
      - 'hotfix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Generate assets
        run: python tools/build_assets.py

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Configure release repository
        shell: pwsh
        run: |
          $cfg = @{
            repository = "${{ github.repository }}"
            channel = "stable"
            check_on_start = $true
            developer = "kriskarter"
            developer_url = "https://github.com/kriskarter"
          }
          $cfg | ConvertTo-Json |
            Set-Content -Encoding UTF8 release_config.json

      - name: Build Release Candidate executables
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name CoD2ChatTranslator `
            --icon assets/app.ico `
            --add-data "assets;assets" `
            --add-data "release_config.json;." `
            app.py

          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name CoD2ChatTranslatorUpdater `
            --icon assets/app.ico `
            updater.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --no-progress -y

      - name: Build multilingual Release Candidate installer
        shell: pwsh
        run: |
          $version = python app.py --version

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" `
            installer\CoD2ChatTranslator.iss

          $setup = "release\CoD2ChatTranslator_Setup_v$version.exe"

          if (!(Test-Path $setup)) {
            throw "Installer was not created: $setup"
          }

          Get-FileHash $setup -Algorithm SHA256

      - name: Prepare RC information
        shell: pwsh
        run: |
          $version = python app.py --version

          @"
          CoD2 Chat Translator v$version — Release Candidate

          INSTALLATION TEST BUILD

          Use:
          CoD2ChatTranslator_Setup_v$version.exe

          Test:
          - Windows language auto-detection
          - Russian / Ukrainian / English Setup
          - first application launch language
          - language switching inside the application
          - incoming translation
          - F9 outgoing translated chat
          - F10 screenshots
          - Administrator elevation
          - updater language

          This workflow does NOT publish a GitHub Release.
          "@ | Set-Content -Encoding UTF8 release\RC_README.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CoD2-Chat-Translator-RC-Installer
          path: |
            release/CoD2ChatTranslator_Setup_v*.exe
            release/RC_README.txt
