name: Qt Preview Windows installer (PR 9 only)
on:
  push:
    branches: ['experiment/qt-premium-game-ui']
  workflow_dispatch:
    inputs:
      publish_stable:
        description: Publish the verified stable installer from the current main commit
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: qt-preview-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/experiment/qt-premium-game-ui'
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QT_QPA_FONTDIR: C:\Windows\Fonts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt PySide6==6.8.3 pytest psutil
      - name: Regression and Qt friend interaction screenshots
        env:
          COD2_QT_TEST_SCREENSHOTS: qt-evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force qt-evidence | Out-Null
          python -m pytest -q
      - name: Freeze isolated Qt executable
        shell: pwsh
        run: |
          @{ tag = "qt-preview-" + $env:GITHUB_SHA.Substring(0,12); sha = $env:GITHUB_SHA } | ConvertTo-Json -Compress | Set-Content -Encoding utf8NoBOM qt_build.json
          pyinstaller --noconfirm --clean --paths . --onedir --windowed --name CoD2ChatTranslatorQt --icon assets/app.ico --add-data "assets;assets" --add-data "qt_build.json;." --add-data "qt_experiment;qt_experiment" --hidden-import PySide6.QtQuick --hidden-import PySide6.QtQuickControls2 --hidden-import PySide6.QtQml --hidden-import PySide6.QtTest qt_experiment/rc_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record resolved dependency inventory
        shell: pwsh
        run: |
          python -m pip freeze | Set-Content -Encoding utf8 qt_dependency_inventory.txt
          Add-Content qt_dependency_inventory.txt "`nBundled Qt DLLs:"
          Get-ChildItem dist/CoD2ChatTranslatorQt -Recurse -Filter "Qt6*.dll" | ForEach-Object { $_.Name } | Sort-Object -Unique | Add-Content qt_dependency_inventory.txt
      - name: Smoke test actual frozen EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force qt-evidence | Out-Null
          $root = Join-Path $PWD "qt-evidence"
          $config = Join-Path $root "fixture.json"
          '{"server_monitor":{"servers":[]},"ui_language":"en","auto_detect_profile":false}' | Set-Content -Encoding utf8NoBOM $config
          foreach ($page in @("home","servers","settings","history","outgoing","profiles","knowledge","notifications","about","stats","overlay")) {
            $out = Join-Path $root "$page.png"
            $settings = Join-Path $root "qt_settings.json"
            $exe = Join-Path $PWD "dist\CoD2ChatTranslatorQt\CoD2ChatTranslatorQt.exe"
            $args = @("--config", "`"$config`"", "--settings-file", "`"$settings`"", "--page", $page, "--size", "1366x768", "--screenshot", "`"$out`"")
            $p = Start-Process -FilePath $exe -ArgumentList $args -PassThru
            if (!$p.WaitForExit(90000)) { $p.Kill(); throw "Frozen smoke timed out: $page" }
            if ($p.ExitCode -ne 0 -or !(Test-Path $out) -or (Get-Item $out).Length -lt 5000) { throw "Frozen smoke failed: $page" }
          }
      - name: Frozen actual client area, all pages RU UK EN
        shell: pwsh
        run: |
          $root = Join-Path $PWD "qt-evidence"
          $exe = Join-Path $PWD "dist\CoD2ChatTranslatorQt\CoD2ChatTranslatorQt.exe"
          $config = Join-Path $root "fixture.json"
          $settings = Join-Path $root "qt_settings.json"
          foreach ($lang in @("ru","uk","en")) {
            foreach ($page in @("home","servers","settings","history","outgoing","profiles","knowledge","notifications","about","stats","overlay")) {
              $out = Join-Path $root "client_${lang}_${page}.png"
              $args = @("--config","`"$config`"","--settings-file","`"$settings`"","--ui-language",$lang,"--size","1342x672","--page",$page,"--screenshot","`"$out`"")
              $p = Start-Process $exe -ArgumentList $args -PassThru
              if (!$p.WaitForExit(90000)) { $p.Kill(); throw "Client capture timeout" }
              if ($p.ExitCode -ne 0 -or !(Test-Path $out)) { throw "Client capture failed: $lang $page" }
            }
          }
      - name: Frozen EXE scale and locale matrix (simulated DPI)
        shell: pwsh
        run: |
          $root = Join-Path $PWD "qt-evidence"
          $exe = Join-Path $PWD "dist\CoD2ChatTranslatorQt\CoD2ChatTranslatorQt.exe"
          $config = Join-Path $root "fixture.json"
          $settings = Join-Path $root "qt_settings.json"
          foreach ($scale in @(1.0,1.25,1.5)) {
            $env:QT_SCALE_FACTOR = $scale.ToString([Globalization.CultureInfo]::InvariantCulture)
            foreach ($resolution in @("1366x768","1536x864","1920x1080")) {
              $parts = $resolution.Split("x")
              $w = [int][Math]::Floor([int]$parts[0]/$scale)
              $h = [int][Math]::Floor([int]$parts[1]/$scale)
              $size = "${w}x${h}"
              $out = Join-Path $root "scale_${scale}_${resolution}.png"
              $args = @("--config","`"$config`"","--settings-file","`"$settings`"","--size",$size,"--page","home","--screenshot","`"$out`"")
              $p = Start-Process $exe -ArgumentList $args -PassThru
              if (!$p.WaitForExit(90000)) { $p.Kill(); throw "Scale smoke timeout" }
              if ($p.ExitCode -ne 0 -or !(Test-Path $out)) { throw "Scale smoke failed: $scale $resolution" }
            }
          }
          Remove-Item Env:QT_SCALE_FACTOR -ErrorAction SilentlyContinue
          foreach ($lang in @("ru","uk","en")) {
            $out = Join-Path $root "locale_${lang}.png"
            $p = Start-Process $exe -ArgumentList @("--config","`"$config`"","--settings-file","`"$settings`"","--page","settings","--ui-language",$lang,"--size","1366x768","--screenshot","`"$out`"") -PassThru
            if (!$p.WaitForExit(90000)) { $p.Kill(); throw "Locale smoke timeout" }
            if ($p.ExitCode -ne 0 -or !(Test-Path $out)) { throw "Locale smoke failed: $lang" }
          }
      - name: Frozen compact pages and actual dialogs
        shell: pwsh
        run: |
          $root = Join-Path $PWD "qt-evidence"
          $exe = Join-Path $PWD "dist\CoD2ChatTranslatorQt\CoD2ChatTranslatorQt.exe"
          $config = Join-Path $root "fixture.json"
          $settings = Join-Path $root "qt_settings.json"
          $env:QT_SCALE_FACTOR = "1.5"
          foreach ($page in @("servers","settings","history","outgoing","profiles","knowledge","notifications","about","stats","overlay")) {
            $out = Join-Path $root "compact_$page.png"
            $args = @("--config","`"$config`"","--settings-file","`"$settings`"","--size","910x512","--page",$page,"--screenshot","`"$out`"")
            $p = Start-Process $exe -ArgumentList $args -PassThru
            if (!$p.WaitForExit(90000)) { $p.Kill(); throw "Compact page timeout" }
            if ($p.ExitCode -ne 0 -or !(Test-Path $out)) { throw "Compact page failed: $page" }
          }
          Remove-Item Env:QT_SCALE_FACTOR -ErrorAction SilentlyContinue
          foreach ($entry in @("home:add_server_dialog","home:incoming_hud_dialog","home:outgoing_hud_dialog","outgoing:outgoing_hud_dialog","servers:server_remove_dialog","history:history_clear_dialog","knowledge:knowledge_clear_dialog","profiles:game_logging_dialog","home:friends_panel","servers:friends_panel","about:update_install_dialog")) {
            $parts = $entry.Split(":")
            $out = Join-Path $root "dialog_$($parts[0])_$($parts[1]).png"
            $args = @("--config","`"$config`"","--settings-file","`"$settings`"","--size","1366x768","--page",$parts[0],"--dialog",$parts[1],"--screenshot","`"$out`"")
            $p = Start-Process $exe -ArgumentList $args -PassThru
            if (!$p.WaitForExit(90000)) { $p.Kill(); throw "Dialog timeout" }
            if ($p.ExitCode -ne 0 -or !(Test-Path $out)) { throw "Dialog failed: $entry" }
          }
      - name: Build isolated multilingual installer
        shell: pwsh
        run: |
          python installer/prepare_qt_wizard.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install innosetup --version=6.7.1 --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\CoD2ChatTranslatorQtPreview.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "release-qt\CoD2ChatTranslator_QtPreview_Setup.exe"
          if (!(Test-Path $setup)) { throw "Installer missing" }
          (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() + "  CoD2ChatTranslator_QtPreview_Setup.exe" | Set-Content -Encoding ascii release-qt\SHA256SUMS.txt
      - name: Capture clean installation in the native Windows wizard
        shell: pwsh
        run: |
          python -m pip install pywinauto==0.6.9
          python tools/qt_installer_evidence.py release-qt/CoD2ChatTranslator_QtPreview_Setup.exe "$env:RUNNER_TEMP/cod2-qt-install" qt-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test installed application
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "cod2-qt-install"
          $setup = Join-Path $PWD "release-qt\CoD2ChatTranslator_QtPreview_Setup.exe"
          $p = Start-Process $setup -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LANG=ukrainian","/DIR=`"$dir`"") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installation failed: $($p.ExitCode)" }
          $out = Join-Path $PWD "qt-evidence\installed_home.png"
          $exe = Join-Path $dir "CoD2ChatTranslatorQt.exe"
          $p = Start-Process $exe -ArgumentList @("--size","1366x768","--screenshot","`"$out`"") -PassThru
          if (!$p.WaitForExit(90000)) { $p.Kill(); throw "Installed EXE timeout" }
          if ($p.ExitCode -ne 0 -or !(Test-Path $out)) { throw "Installed EXE failed" }
      - name: Capture installed EXE using the native Windows platform
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          QT_SCALE_FACTOR: '1'
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "cod2-qt-install/CoD2ChatTranslatorQt.exe"
          $root = Join-Path $PWD "qt-evidence"
          $config = Join-Path $root "fixture.json"
          $settings = Join-Path $root "native_settings.json"
          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
            try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop }
            catch { Write-Host "Using native minimum-size capture on the runner desktop" }
          }
          foreach ($page in @("home","servers","settings","history","outgoing","profiles","knowledge","notifications","about","stats","overlay")) {
            $out = Join-Path $root "native_installed_ru_$page.png"
            $args = @("--config", "`"$config`"", "--settings-file", "`"$settings`"", "--size", "1342x672", "--ui-language", "ru", "--page", $page, "--screenshot", "`"$out`"")
            $p = Start-Process $exe -ArgumentList $args -PassThru
            if (!$p.WaitForExit(60000)) { $p.Kill(); throw "Native installed capture timeout: $page" }
            if ($p.ExitCode -ne 0 -or !(Test-Path $out) -or (Get-Item $out).Length -lt 5000) { throw "Native installed capture failed: $page" }
            python -c "from PIL import Image; import sys; im=Image.open(sys.argv[1]); assert im.size==(1342,672), im.size" "$out"
            if ($LASTEXITCODE -ne 0) { throw "Native client dimensions changed: $page" }
          }
      - name: Capture native installed banner at all acceptance resolutions
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          QT_SCALE_FACTOR: '1'
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "cod2-qt-install/CoD2ChatTranslatorQt.exe"
          $root = Join-Path $PWD "qt-evidence"
          $config = Join-Path $root "fixture.json"
          $settings = Join-Path $root "native_banner_settings.json"
          foreach ($size in @("1366x768","1536x864","1920x1080","1342x672")) {
            $out = Join-Path $root "native_banner_$size.png"
            $args = @("--config", "`"$config`"", "--settings-file", "`"$settings`"", "--size", $size, "--ui-language", "ru", "--page", "home", "--screenshot", "`"$out`"")
            $p = Start-Process $exe -ArgumentList $args -PassThru
            if (!$p.WaitForExit(60000)) { $p.Kill(); throw "Native banner timeout: $size" }
            if ($p.ExitCode -ne 0 -or !(Test-Path $out)) { throw "Native banner capture failed: $size" }
            python -c "from PIL import Image; import sys; assert Image.open(sys.argv[1]).size==tuple(map(int,sys.argv[2].split('x')))" "$out" "$size"
            if ($LASTEXITCODE -ne 0) { throw "Native banner dimensions changed: $size" }
          }
      - name: Native installed banner DPI matrix (simulated Qt scale)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "cod2-qt-install/CoD2ChatTranslatorQt.exe"
          $root = Join-Path $PWD "qt-evidence"
          $config = Join-Path $root "fixture.json"
          $settings = Join-Path $root "native_banner_settings.json"
          foreach ($scale in @(1.0,1.25,1.5)) {
            $scaleText = $scale.ToString([Globalization.CultureInfo]::InvariantCulture)
            $env:QT_SCALE_FACTOR = $scaleText
            foreach ($resolution in @("1366x768","1536x864","1920x1080")) {
              $parts = $resolution.Split("x")
              $w = [int][Math]::Floor([int]$parts[0]/$scale)
              $h = [int][Math]::Floor([int]$parts[1]/$scale)
              $size = "$($w)x$($h)"
              $out = Join-Path $root "native_dpi_$($scaleText)_$resolution.png"
              $args = @("--config", "`"$config`"", "--settings-file", "`"$settings`"", "--size", $size, "--ui-language", "ru", "--page", "home", "--screenshot", "`"$out`"")
              $p = Start-Process $exe -ArgumentList $args -PassThru
              if (!$p.WaitForExit(60000)) { $p.Kill(); throw "Native DPI capture timeout: $scaleText $resolution" }
              if ($p.ExitCode -ne 0 -or !(Test-Path $out) -or (Get-Item $out).Length -lt 5000) { throw "Native DPI capture failed: $scaleText $resolution" }
              python -c "from PIL import Image; import sys; a=Image.open(sys.argv[1]).size; b=tuple(round(int(x)*float(sys.argv[3])) for x in sys.argv[2].split('x')); assert all(abs(x-y)<=2 for x,y in zip(a,b)),(a,b)" "$out" "$size" "$scaleText"
              if ($LASTEXITCODE -ne 0) { throw "Native DPI capture dimensions changed" }
            }
          }
          Remove-Item Env:QT_SCALE_FACTOR -ErrorAction SilentlyContinue
      - name: Verify installed Qt hotkey startup without injecting input
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "cod2-qt-install/CoD2ChatTranslatorQt.exe"
          $p = Start-Process $exe -ArgumentList "--verify-game-hotkeys" -PassThru
          if (!$p.WaitForExit(30000)) { $p.Kill(); throw "Installed keyboard initialization timed out" }
          if ($p.ExitCode -ne 0) { throw "Installed keyboard initialization failed: $($p.ExitCode)" }
      - name: Verify reinstall preserves Qt settings and uninstall
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "cod2-qt-install"
          $setup = Join-Path $PWD "release-qt\CoD2ChatTranslator_QtPreview_Setup.exe"
          $settings = Join-Path $env:APPDATA "CoD2ChatTranslatorQtPreview\qt_settings.json"
          New-Item -ItemType Directory -Force (Split-Path $settings) | Out-Null
          '{"ui_language":"uk","server_profiles":[{"name":"Acceptance profile","path":"fixture"}],"server_monitor":{"servers":[{"address":"127.0.0.1:28960","label":"Acceptance server","favorite":true}],"friends":["Medic"]},"qt_overlay_enabled":true}' | Set-Content -Encoding utf8NoBOM $settings
          $desktop = Join-Path ([Environment]::GetFolderPath("DesktopDirectory")) "CoD2 Chat Translator Qt Preview.lnk"
          $shell = New-Object -ComObject WScript.Shell
          if (!(Test-Path $desktop) -or $shell.CreateShortcut($desktop).TargetPath -ne (Join-Path $dir "CoD2ChatTranslatorQt.exe")) { throw "Desktop shortcut target is incorrect" }
          $before = (Get-FileHash $settings -Algorithm SHA256).Hash
          $p = Start-Process $setup -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LANG=english","/DIR=`"$dir`"") -PassThru -Wait
          if ($p.ExitCode -ne 0 -or (Get-FileHash $settings -Algorithm SHA256).Hash -ne $before) { throw "Reinstall settings preservation failed" }
          $uninstall = Join-Path $dir "unins000.exe"
          $p = Start-Process $uninstall -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART") -PassThru -Wait
          if ($p.ExitCode -ne 0 -or (Test-Path (Join-Path $dir "CoD2ChatTranslatorQt.exe")) -or (Get-FileHash $settings -Algorithm SHA256).Hash -ne $before) { throw "Uninstall/settings preservation failed" }
          if (Test-Path $desktop) { throw "Uninstall left the desktop shortcut" }
      - name: Upgrade from the accepted c9ec1acd8ca2 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "previous-qt-setup"
          gh release download qt-preview-c9ec1acd8ca2 --dir $cache --pattern "CoD2ChatTranslator_QtPreview_Setup.exe" --pattern "SHA256SUMS.txt"
          if ($LASTEXITCODE -ne 0) { throw "Previous installer unavailable" }
          $old = Join-Path $cache "CoD2ChatTranslator_QtPreview_Setup.exe"
          $expected = ((Get-Content (Join-Path $cache "SHA256SUMS.txt") -First 1) -split '\s+')[0]
          if ((Get-FileHash $old).Hash -ne $expected) { throw "Previous release checksum mismatch" }
          $dir = Join-Path $env:RUNNER_TEMP "cod2-qt-install"
          $argsList = @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$dir`"")
          if ((Start-Process $old -ArgumentList $argsList -Wait -PassThru).ExitCode) { throw "Previous RC install failed" }
          $settings = Join-Path $env:APPDATA "CoD2ChatTranslatorQtPreview\qt_settings.json"
          $config = '{"ui_language":"uk","outgoing_hud":{"width":430,"height":145,"font_size":14,"background_opacity":0.82},"server_monitor":{"servers":[{"address":"148.251.139.73:12345","favorite":true}],"friends":["Medic"]}}'
          $config | Set-Content -Encoding utf8NoBOM $settings
          $before = (Get-FileHash $settings).Hash
          $new = Join-Path $PWD "release-qt\CoD2ChatTranslator_QtPreview_Setup.exe"
          if ((Start-Process $new -ArgumentList $argsList -Wait -PassThru).ExitCode -or (Get-FileHash $settings).Hash -ne $before) { throw "RC upgrade failed" }
      - name: Download and verify immediately previous accepted RC
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "accepted-9924-qt-setup"
          gh release download qt-preview-9924b7e304a0 --dir $cache --pattern "CoD2ChatTranslator_QtPreview_Setup.exe" --pattern "SHA256SUMS.txt"
          if ($LASTEXITCODE -ne 0) { throw "Previous accepted RC unavailable" }
          $previous = Join-Path $cache "CoD2ChatTranslator_QtPreview_Setup.exe"
          $expected = ((Get-Content (Join-Path $cache "SHA256SUMS.txt") -First 1) -split '\s+')[0]
          if ((Get-FileHash $previous).Hash -ne $expected) { throw "Previous accepted RC checksum mismatch" }
      - name: Native installed UI migration (legacy explicit save, new autosave)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          QT_SCALE_FACTOR: '1'
          QT_ACCESSIBILITY: '1'
        run: |
          $old = Join-Path $env:RUNNER_TEMP "previous-qt-setup/CoD2ChatTranslator_QtPreview_Setup.exe"
          $new = Join-Path $PWD "release-qt/CoD2ChatTranslator_QtPreview_Setup.exe"
          python tools/qt_upgrade_ui_evidence.py "$old" "$new" "$env:RUNNER_TEMP/cod2-qt-install" "$env:RUNNER_TEMP/cod2-ui-acceptance" qt-evidence "$env:RUNNER_TEMP/accepted-9924-qt-setup/CoD2ChatTranslator_QtPreview_Setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: qt-preview-windows-installer
          path: release-qt/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qt-preview-frozen-ui-evidence
          path: |
            qt-evidence/*.png
            qt-evidence/*.json
          if-no-files-found: error
  candidate:
    if: github.ref == 'refs/heads/experiment/qt-premium-game-ui' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QT_QPA_FONTDIR: C:\Windows\Fonts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt PySide6==6.8.3 psutil pywinauto==0.6.9
      - name: Build candidate with the stable installation identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $channel = if ($env:GITHUB_REF -eq "refs/heads/main") { "stable" } else { "candidate" }
          @{ channel = $channel; tag = "v1.22.0"; sha = $env:GITHUB_SHA } | ConvertTo-Json -Compress | Set-Content -Encoding utf8NoBOM qt_build.json
          pyinstaller --noconfirm --clean --paths . --onedir --windowed --name CoD2ChatTranslatorQt --icon assets/app.ico --add-data "assets;assets" --add-data "qt_build.json;." --add-data "qt_experiment;qt_experiment" --hidden-import PySide6.QtQuick --hidden-import PySide6.QtQuickControls2 --hidden-import PySide6.QtQml --hidden-import PySide6.QtTest qt_experiment/rc_entry.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip freeze | Set-Content qt_dependency_inventory.txt
          python installer/prepare_qt_wizard.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          choco install innosetup --version=6.7.1 --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DStableCandidate installer\CoD2ChatTranslatorQtPreview.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $setup = "release-qt/CoD2ChatTranslator_Setup.exe"
          (Get-FileHash $setup).Hash.ToLower() + "  CoD2ChatTranslator_Setup.exe" | Set-Content -Encoding ascii release-qt/SHA256SUMS.txt
          python tools/prepare_installer_manifest.py release-qt 1.22.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/prepare_legacy_bridge.py dist/CoD2ChatTranslatorQt release-qt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Exercise the stable installer and both existing player profiles
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path "release-qt/CoD2ChatTranslator_Setup.exe").Path
          $dir = "$env:RUNNER_TEMP/candidate"
          $exe = "$dir/CoD2ChatTranslatorQt.exe"
          $stable = "$env:APPDATA/CoD2ChatTranslator"
          $preview = "$env:APPDATA/CoD2ChatTranslatorQtPreview"
          $settings = "$stable/qt_settings.json"
          python tools/qt_installer_evidence.py $setup $dir candidate-evidence
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($language in @("russian","ukrainian")) {
            python tools/qt_installer_evidence.py $setup $dir "candidate-evidence/$language" $language
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $shell = New-Object -ComObject WScript.Shell
          foreach ($folder in @("DesktopDirectory", "Programs")) {
            $link = Join-Path ([Environment]::GetFolderPath($folder)) "CoD2 Chat Translator.lnk"
            if (!(Test-Path $link) -or $shell.CreateShortcut($link).TargetPath -ne [IO.Path]::GetFullPath($exe)) { throw "Bad shortcut in $folder" }
          }
          function Install($installer, $dest) {
            $p = Start-Process $installer -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$dest`"") -Wait -PassThru
            if ($p.ExitCode) { throw "Installer failed: $($p.ExitCode)" }
          }
          function Capture($name) {
            $out = "$PWD/candidate-evidence/$name.png"
            $p = Start-Process $exe -ArgumentList @("--screenshot","`"$out`"","--size","1366x768") -PassThru
            if (!$p.WaitForExit(90000) -or $p.ExitCode -ne 0 -or !(Test-Path $out)) { throw "Installed app failed: $name" }
          }
          Capture clean
          foreach ($tag in @("v1.17.4","qt-preview-9333bb561122")) {
            $old = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
            $asset = $old.assets | Where-Object { $_.name -like "*.exe" }
            gh release download $tag -D "$env:RUNNER_TEMP/$tag" -p $asset.name
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $file = "$env:RUNNER_TEMP/$tag/$($asset.name)"
            if ("sha256:"+ (Get-FileHash $file).Hash.ToLower() -ne $asset.digest) { throw "Old installer integrity failed" }
            $source = "$stable/config.json"
            $dest = $dir
            if ($tag -like "qt-*") { $source = "$preview/qt_settings.json"; $dest = "$env:RUNNER_TEMP/old-preview" }
            Install $file $dest
            New-Item -Force -ItemType Directory (Split-Path $source) | Out-Null
            if (Test-Path $settings) { Move-Item $settings "$env:RUNNER_TEMP/$tag-previous-profile.json" }
            @{ui_language="uk";server_monitor=@{servers=@(@{address="example.com:12345";favorite=$true});friends=@($tag)}} | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8NoBOM $source
            $before = (Get-FileHash $source).Hash
            if ($tag -eq "v1.17.4") {
              # Verify the genuine updater applies our archive in its original directory.
              # A local file URI isolates this compatibility test from public release discovery.
              $manifest = Get-Content release-qt/update.json -Raw | ConvertFrom-Json
              $package = (Resolve-Path "release-qt/$($manifest.asset)").Path
              if ((Get-FileHash $package).Hash.ToLower() -ne $manifest.sha256) { throw "Bridge checksum mismatch" }
              $updater = "$env:RUNNER_TEMP/original-updater.exe"
              Copy-Item "$dir/CoD2ChatTranslatorUpdater.exe" $updater
              $bridgeDir = "$env:RUNNER_TEMP/legacy-bridge-test"
              New-Item -ItemType Directory -Force $bridgeDir | Out-Null
              Copy-Item "$dir/CoD2ChatTranslator.exe" $bridgeDir
              $uri = [Uri]::new($package).AbsoluteUri
              $p = Start-Process $updater -ArgumentList @("--install-dir", "`"$bridgeDir`"", "--download-url", $uri, "--sha256", $manifest.sha256, "--main-exe", "CoD2ChatTranslator.exe", "--version", "1.22.0") -PassThru
              if (!$p.WaitForExit(180000) -or $p.ExitCode) { throw "Original updater failed to apply bridge" }
              $bridgeExe = "$bridgeDir/CoD2ChatTranslator.exe"
              if ((Get-FileHash $bridgeExe).Hash -ne (Get-FileHash dist/CoD2ChatTranslatorQt/CoD2ChatTranslatorQt.exe).Hash) { throw "Bridge entry point mismatch" }
              Get-Process -Name CoD2ChatTranslator -ErrorAction SilentlyContinue | Where-Object Path -eq $bridgeExe | Stop-Process
              if (Test-Path $settings) { Move-Item $settings "$env:RUNNER_TEMP/bridge-profile.json" }
            }
            Install $setup $dir
            Capture $tag
            $saved = Get-Content -Raw $settings | ConvertFrom-Json
            if ($saved.server_monitor.friends -notcontains $tag -or $saved.server_monitor.servers[0].address -ne "example.com:12345" -or $before -ne (Get-FileHash $source).Hash) { throw "Migration failed for $tag" }
          }
          $before = (Get-FileHash $settings).Hash
          Install $setup $dir
          Capture reinstall
          if ((Get-FileHash $settings).Hash -ne $before) { throw "Reinstall changed the migrated profile" }
          $env:QT_QPA_PLATFORM = "windows"
          $env:QT_SCALE_FACTOR = "1"
          $env:QT_ACCESSIBILITY = "1"
          $env:COD2_STABLE_CANDIDATE = "1"
          $old = "$env:RUNNER_TEMP/qt-preview-9333bb561122/CoD2ChatTranslator_QtPreview_Setup.exe"
          python tools/qt_upgrade_ui_evidence.py $old $setup $dir "$env:RUNNER_TEMP/candidate-ui-profile" candidate-evidence
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $before = (Get-FileHash $settings).Hash
          $p = Start-Process "$dir/unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -or (Test-Path $exe) -or $before -ne (Get-FileHash $settings).Hash) { throw "Uninstall failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: stable-candidate-installer
          path: release-qt/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-candidate-evidence
          path: candidate-evidence/
  stable-release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_stable
    needs: [candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: stable-candidate-installer
          path: release-qt
      - name: Sign the installer manifest
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          python -m pip install cryptography==49.0.0
          python tools/sign_update.py release-qt/update.json
          python tools/sign_update.py release-qt/installer-update.json
          python -c "import json; from update_client import verify_update_manifest_signature as verify; assert all(verify(json.load(open('release-qt/'+name))) for name in ('update.json','installer-update.json'))"
      - name: Verify the approved commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          gh run list --workflow qt-quick-smoke.yml --commit "$GITHUB_SHA" --json conclusion --jq '.[].conclusion' | grep -qx success
          (cd release-qt && sha256sum --check SHA256SUMS.txt)
          gh release create v1.22.0 release-qt/update.json release-qt/CoD2ChatTranslator_Update.zip release-qt/CoD2ChatTranslator_Setup.exe release-qt/SHA256SUMS.txt release-qt/installer-update.json --target "$GITHUB_SHA" --latest --title "CoD2 Chat Translator 1.22.0" --notes-file release-qt/RELEASE_NOTES.md
  publish:
    needs: build
    # Keep candidate artifacts available for native visual and migration acceptance.
    # Publish only after explicit dispatch and the existing exact-SHA smoke gate.
    if: github.ref == 'refs/heads/experiment/qt-premium-game-ui' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require successful exact-head Windows smoke and current branch
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/experiment/qt-premium-game-ui" --jq .object.sha)
            if [ "$head" != "$GITHUB_SHA" ]; then
              echo "Superseded SHA; do not publish a release."
              exit 1
            fi
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow qt-quick-smoke.yml --commit "$GITHUB_SHA" --json status,conclusion,headSha --limit 5)
            if jq -e --arg sha "$GITHUB_SHA" 'any(.[]; .headSha == $sha and .status == "completed" and .conclusion == "success")' <<<"$runs" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Exact-head Windows smoke not successful; release blocked."
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: qt-preview-windows-installer
          path: release-qt
      - name: Publish isolated prerelease (never latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/experiment/qt-premium-game-ui" --jq .object.sha)
          test "$head" = "$GITHUB_SHA" || { echo "Superseded SHA"; exit 1; }
          tag="qt-preview-${GITHUB_SHA:0:12}"
          gh release create "$tag" release-qt/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "CoD2 Chat Translator Qt Preview $tag" --notes "F8 toggle and HUD recovery, compact F9, automatic Windows UAC, session chat history and a branded installer. Native gameplay acceptance pending unless separately recorded. Does not replace stable."
