name: Qt Quick Windows smoke (PR 9 development)
on:
  push:
    branches: ['experiment/qt-premium-game-ui']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qt-smoke:
    if: github.ref == 'refs/heads/experiment/qt-premium-game-ui'
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt PySide6==6.8.3 pytest psutil
      - name: Regression and Qt runtime tests
        env:
          COD2_QT_TEST_SCREENSHOTS: qt-smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force qt-smoke | Out-Null
          python -m pytest -q
      - name: Capture development UI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force qt-smoke | Out-Null
          foreach ($size in @('1366x768','1536x864','1920x1080','900x620')) {
            python -m qt_experiment.quick --size $size --screenshot "qt-smoke/home_$size.png"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: qt-quick-windows-development-screenshots
          path: qt-smoke/
          if-no-files-found: error
