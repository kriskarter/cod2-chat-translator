name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish this version as a GitHub Release'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Record resolved Windows dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          python -m pip freeze | Set-Content -Encoding UTF8 release\DEPENDENCIES_WINDOWS.txt

      - name: Generate Windows branding assets
        run: python tools/build_assets.py

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Configure release repository
        shell: pwsh
        run: |
          $cfg = @{ repository = "${{ github.repository }}"; channel = "stable"; check_on_start = $true; developer = "kriskarter"; developer_url = "https://github.com/kriskarter" }
          $cfg | ConvertTo-Json | Set-Content -Encoding UTF8 release_config.json

      - name: Build Windows executables
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name CoD2ChatTranslator --icon assets/app.ico --add-data "assets;assets" --add-data "release_config.json;." app.py
          pyinstaller --noconfirm --clean --onefile --windowed --name CoD2ChatTranslatorUpdater --icon assets/app.ico updater.py

      - name: Prepare update package
        run: python tools/prepare_release.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Prepare concise GitHub Release notes
        shell: pwsh
        run: |
          $notes = Get-Content release_notes.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $version = python app.py --version
          $body = @"
          ## Что нового

          $($notes.notes_ru)

          ## What's new

          $($notes.notes_en)

          ---

          Для обычной установки скачай CoD2ChatTranslator_Setup_v$version.exe из списка файлов ниже.

          For a normal installation, download CoD2ChatTranslator_Setup_v$version.exe from the files below.
          "@
          $body | Set-Content -Encoding UTF8 release\RELEASE_NOTES.md

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Build bilingual Setup.exe
        shell: pwsh
        run: |
          $version = python app.py --version
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\CoD2ChatTranslator.iss

      - uses: actions/upload-artifact@v4
        with:
          name: CoD2ChatTranslator-Windows
          path: |
            release/CoD2ChatTranslator_Setup_v*.exe
            release/CoD2ChatTranslator_Update.zip
            release/CoD2ChatTranslator_Update.zip.sha256
            release/update.json
            release/RELEASE_NOTES.md
            release/DEPENDENCIES_WINDOWS.txt

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          name: CoD2ChatTranslator-Windows
          path: release

      - name: Install signing dependency
        run: python -m pip install cryptography==49.0.0

      - name: Sign update manifest
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: python tools/sign_update.py release/update.json

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(python - <<'PYREL'
          import json
          with open("release/update.json", encoding="utf-8-sig") as f:
              print(json.load(f)["version"])
          PYREL
          )"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${version}"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "CoD2 Chat Translator $tag" \
              --notes-file release/RELEASE_NOTES.md
          else
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              gh release create "$tag" \
                --title "CoD2 Chat Translator $tag" \
                --notes-file release/RELEASE_NOTES.md
            else
              gh release create "$tag" \
                --target "${GITHUB_SHA}" \
                --title "CoD2 Chat Translator $tag" \
                --notes-file release/RELEASE_NOTES.md
            fi
          fi

          gh release upload "$tag" \
            release/CoD2ChatTranslator_Setup_v*.exe \
            release/CoD2ChatTranslator_Update.zip \
            release/CoD2ChatTranslator_Update.zip.sha256 \
            release/update.json \
            --clobber
