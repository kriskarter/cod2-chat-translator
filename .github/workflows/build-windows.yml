name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish this version as a GitHub Release'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Generate Windows branding assets
        run: python tools/build_assets.py

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Configure release repository
        shell: pwsh
        run: |
          $cfg = @{ repository = "${{ github.repository }}"; channel = "stable"; check_on_start = $true; developer = "kriskarter"; developer_url = "https://github.com/kriskarter" }
          $cfg | ConvertTo-Json | Set-Content -Encoding UTF8 release_config.json

      - name: Build Windows executables
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name CoD2ChatTranslator --icon assets/app.ico --add-data "assets;assets" --add-data "release_config.json;." app.py
          pyinstaller --noconfirm --clean --onefile --windowed --name CoD2ChatTranslatorUpdater --icon assets/app.ico updater.py

      - name: Prepare update package
        run: python tools/prepare_release.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build bilingual Setup.exe
        shell: pwsh
        run: |
          $version = python app.py --version
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\CoD2ChatTranslator.iss

      - uses: actions/upload-artifact@v4
        with:
          name: CoD2ChatTranslator-Windows
          path: |
            release/CoD2ChatTranslator_Setup_v*.exe
            release/CoD2ChatTranslator_Update.zip
            release/CoD2ChatTranslator_Update.zip.sha256
            release/update.json

      - name: Publish tagged GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "CoD2 Chat Translator $tag" --generate-notes
          }
          gh release upload $tag (Get-ChildItem release/CoD2ChatTranslator_Setup_v*.exe).FullName release/CoD2ChatTranslator_Update.zip release/CoD2ChatTranslator_Update.zip.sha256 release/update.json --clobber

      - name: Publish manual GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python app.py --version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "${{ github.sha }}" --title "CoD2 Chat Translator $tag" --notes-file README_RU.md
          }
          gh release upload $tag (Get-ChildItem release/CoD2ChatTranslator_Setup_v*.exe).FullName release/CoD2ChatTranslator_Update.zip release/CoD2ChatTranslator_Update.zip.sha256 release/update.json --clobber
