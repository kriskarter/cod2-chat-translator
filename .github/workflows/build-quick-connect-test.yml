name: Build Quick Connect Test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/quick-connect-oborona

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Generate Windows branding assets
        run: python tools/build_assets.py

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Configure test build
        shell: pwsh
        run: |
          $cfg = @{ repository = "${{ github.repository }}"; channel = "stable"; check_on_start = $false; developer = "kriskarter"; developer_url = "https://github.com/kriskarter" }
          $cfg | ConvertTo-Json | Set-Content -Encoding UTF8 release_config.json

      - name: Build Quick Connect test executables
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name CoD2ChatTranslator_QuickConnect_TEST --icon assets/app.ico --add-data "assets;assets" --add-data "release_config.json;." app.py
          pyinstaller --noconfirm --clean --onefile --windowed --name CoD2ChatTranslatorUpdater --icon assets/app.ico updater.py

      - name: Prepare test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-package | Out-Null
          Copy-Item dist\CoD2ChatTranslator_QuickConnect_TEST.exe test-package\
          Copy-Item dist\CoD2ChatTranslatorUpdater.exe test-package\
          @"
          CoD2 Chat Translator — Quick Connect TEST

          Private test build from feature/quick-connect-oborona.
          This is not a public release. Automatic update checks are disabled.
          "@ | Set-Content -Encoding UTF8 test-package\TEST_README.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CoD2ChatTranslator-QuickConnect-TEST
          path: test-package/*
          if-no-files-found: error
